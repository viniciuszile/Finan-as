<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planejamento Financeiro 2027</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1c2937;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1370px;margin:auto;padding:28px 25px 70px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{color:#56728e;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:750}h1{font-size:28px;letter-spacing:-.9px;margin:5px 0}p{color:#687789;margin:5px 0;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid #dce3eb;background:white;color:#263b51;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 2px 4px #152e4507}.btn:hover{background:#f2f7fc}.btn.primary{background:#235474;border-color:#235474;color:white}.btn.primary:hover{background:#1a415d}.btn.danger{color:#a44545}.metricgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:22px 0}.metric{background:white;border:1px solid #e3e8ee;border-radius:13px;padding:18px;min-height:112px;box-shadow:0 4px 15px #14283c07}.metric .small{font-size:12px;color:#6e7c8a;font-weight:650}.metric .big{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:11px;font-variant-numeric:tabular-nums}.metric .hint{font-size:11px;color:#8492a0;margin-top:6px}.green{color:#168168!important}.red{color:#b24c4c!important}.tabs{display:flex;gap:7px;overflow:auto;padding:7px;background:#e7edf3;border-radius:12px;margin:25px 0 19px;scrollbar-width:thin}.tab{border:0;background:transparent;white-space:nowrap;color:#586c7f;font-size:13px;border-radius:8px;padding:10px 14px;font-weight:750}.tab.active{background:white;color:#1b4d6e;box-shadow:0 2px 8px #1b34431a}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,.65fr);gap:17px;align-items:start}.panel{background:white;border:1px solid #e3e8ee;border-radius:13px;overflow:hidden;box-shadow:0 4px 16px #15283b09}.panelhead{padding:19px 21px;border-bottom:1px solid #e9edf1;display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h2{font-size:17px;margin:0;letter-spacing:-.35px}.panelhead .sub{font-size:12px;color:#8793a0;margin-top:4px}.tag{font-size:11px;border-radius:6px;background:#e9f2f7;color:#285d7c;padding:6px 9px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:450px;font-size:13px}th,td{padding:12px 18px;text-align:left;border-bottom:1px solid #edf0f4}th{background:#f7f9fb;color:#728092;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}td.money,th.money{text-align:right;font-variant-numeric:tabular-nums}.section td{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#52728a;font-weight:850;background:#f3f7fa;padding:11px 18px}.total td{font-weight:800;background:#f9fafc}.grand td{font-weight:850;background:#e9f5ef;color:#17765f;font-size:15px}.editable{border:1px solid #d9e5ee;background:#f5faff;border-radius:6px;padding:7px 9px;text-align:right;width:130px;max-width:100%;color:#22516e;outline:none;font-variant-numeric:tabular-nums}.editable:focus{border-color:#3b84aa;box-shadow:0 0 0 3px #3b84aa20}.editable:disabled{background:#f2f4f7;color:#808f9e}.note{padding:13px 20px;color:#8492a1;font-size:11px}.summarylist{padding:8px 19px 20px}.summaryrow{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid #edf0f4;font-size:13px}.summaryrow:last-child{border:0}.summaryrow strong{font-variant-numeric:tabular-nums}.summaryrow.emphasis{font-size:16px;font-weight:800;color:#167b65}.mini{padding:20px}.barrow{display:flex;align-items:center;gap:12px;font-size:12px;margin:15px 0}.barlabel{width:120px;color:#66798c}.bartrack{flex:1;height:10px;background:#e9eef3;border-radius:10px;overflow:hidden}.barfill{height:100%;border-radius:10px;background:#5486a2}.barvalue{font-variant-numeric:tabular-nums;width:73px;text-align:right;color:#526678}.full{grid-column:1/-1}.help{color:#6d8193;font-size:12px;margin:10px 0 0}.investtable{min-width:730px}.investtable th,.investtable td{padding:12px}.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.monthtile{padding:18px;border:1px solid #e5eaf0;border-radius:10px;background:#fbfcfe}.monthtile .month{font-size:12px;font-weight:800;color:#64798c}.monthtile .amount{font-size:19px;font-weight:800;margin-top:10px}.monthtile .minor{font-size:11px;color:#8996a2;margin-top:6px}.chart{padding:15px 20px 18px}.chart svg{display:block;width:100%;height:auto}.empty{font-size:12px;color:#8997a5}.footer{color:#8996a4;font-size:11px;text-align:center;margin-top:25px}#toast{position:fixed;right:18px;bottom:18px;background:#243e50;color:white;padding:11px 16px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}@media(max-width:900px){.metricgrid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{flex-direction:column}.shell{padding:19px 13px}.yeargrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:490px){.metricgrid{gap:8px}.metric{padding:13px;min-height:100px}.metric .big{font-size:20px}.yeargrid{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><div class="shell">
<header class="top"><div><div class="eyebrow">Controle pessoal / Ano financeiro</div><h1>Planejamento Financeiro <span style="color:#3b7291">2027</span></h1><p>Seu orçamento em formato de planilha. Edite os valores e acompanhe a reserva automaticamente.</p></div><div class="actions"><button class="btn primary" id="exportBtn">↓ Exportar dados</button><button class="btn" id="importBtn">↑ Importar dados</button><button class="btn danger" id="resetBtn">Restaurar padrão</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div></header>
<section class="metricgrid" id="metrics"></section><nav class="tabs" id="tabs" aria-label="Abas da planilha"></nav><main id="main"></main><footer class="footer">Valores em reais (BRL) · Alterações salvas automaticamente neste navegador · Projeção sem rendimentos ou bonificações</footer></div><div id="toast" role="status"></div>
<script>
(()=>{'use strict';
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const LABELS={salary:'Salário líquido',bonus:'Bonificação (se recebida)',light:'Luz',water:'Água',internet:'Internet',haircut:'Cabelo / corte',phone:'Crédito celular',spotify:'Spotify',youtube:'YouTube',medicine:'Remédio cabelo',nubank:'Nubank',santander:'Santander',saving:'Guardar / investir',debt:'Dívida / saída da reserva'};
const FIELDS=['salary','bonus','light','water','internet','haircut','phone','spotify','youtube','medicine','nubank','santander','saving','debt'];
function defaults(){return {initial:3000,months:MONTHS.map((_,i)=>({salary:2240,bonus:0,light:200,water:80,internet:100,haircut:40,phone:40,spotify:15,youtube:20,medicine:75,nubank:i<2?175:0,santander:i===0?100:i<4?65:0,saving:i<2?950:1200,debt:i===4?5500:0}))}}
function validNumber(n){const x=Number(n);return Number.isFinite(x)&&x>=0?Math.round(x*100)/100:0}
function sanitize(raw){let d=defaults();if(!raw||typeof raw!=='object')return d;d.initial=validNumber(raw.initial??d.initial);if(Array.isArray(raw.months))d.months=d.months.map((m,i)=>Object.fromEntries(FIELDS.map(k=>[k,validNumber(raw.months[i]?.[k]??m[k])])));return d}
const KEY='orcamento_2027_v3';let data;try{data=sanitize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{data=defaults()}
let active='overview';const $=id=>document.getElementById(id);const cash=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const fmt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function totals(m){let fixed=m.light+m.water+m.internet,personal=m.haircut+m.phone+m.spotify+m.youtube+m.medicine,cards=m.nubank+m.santander,income=m.salary+m.bonus,spent=fixed+personal+cards+m.saving;return {fixed,personal,cards,income,spent,free:income-spent}}
function computed(){let balance=data.initial;return data.months.map((m,i)=>{let opening=balance;balance+=m.saving-m.debt;return {i,month:MONTHS[i],opening,closing:balance,...totals(m),...m}})}
function sum(a,k){return a.reduce((s,x)=>s+(x[k]||0),0)}function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('Não foi possível salvar no navegador.')}}
let timer;function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2400)}
function input(i,k){return `<input class="editable" type="number" min="0" step="0.01" inputmode="decimal" aria-label="${esc(LABELS[k])} de ${MONTHS[i]}" data-month="${i}" data-field="${k}" value="${data.months[i][k]}">`}
function section(t){return `<tr class="section"><td colspan="2">${t}</td></tr>`}function item(i,k){return `<tr><td>${LABELS[k]}</td><td class="money">${input(i,k)}</td></tr>`}function fixedRow(t,n){return `<tr class="total"><td>${t}</td><td class="money">${cash(n)}</td></tr>`}
function renderMetrics(){let a=computed(),saved=sum(a,'saving'),debts=sum(a,'debt'),end=a[11].closing,free=sum(a,'free');$('metrics').innerHTML=[['Saldo inicial',cash(data.initial),'Reserva antes de janeiro'],['Total de aportes',cash(saved),'Janeiro a dezembro'],['Dívidas da reserva',cash(debts),'Inclui maio'],['Saldo em dezembro',cash(end),'Após aportes e saídas']].map(([label,value,hint],i)=>`<article class="metric"><div class="small">${label}</div><div class="big ${i===3?(end<0?'red':'green'):''}">${value}</div><div class="hint">${hint}</div></article>`).join('')}
function renderTabs(){let options=[['overview','Visão geral'],...MONTHS.map((m,i)=>[String(i),m]),['invest','Investimentos']];$('tabs').innerHTML=options.map(([k,v])=>`<button class="tab ${active===k?'active':''}" data-tab="${k}" aria-selected="${active===k}">${v}</button>`).join('')}
function monthly(i){let m=data.months[i],t=totals(m);$('main').innerHTML=`<div class="layout"><section class="panel"><div class="panelhead"><div><h2>${MONTHS[i]} de 2027</h2><div class="sub">Edite diretamente as células azuis</div></div><span class="tag">Aba ${i+1} de 12</span></div><div class="tablewrap"><table><thead><tr><th>Descrição</th><th class="money">Valor (R$)</th></tr></thead><tbody>${section('Receitas')}${item(i,'salary')}${item(i,'bonus')}${fixedRow('Total de receitas',t.income)}${section('Contas fixas')}${['light','water','internet'].map(k=>item(i,k)).join('')}${fixedRow('Subtotal de contas fixas',t.fixed)}${section('Gastos pessoais')}${['haircut','phone','spotify','youtube','medicine'].map(k=>item(i,k)).join('')}${fixedRow('Subtotal pessoal',t.personal)}${section('Cartões / parcelas')}${item(i,'nubank')}${item(i,'santander')}${fixedRow('Subtotal cartões',t.cards)}${section('Meta de investimento')}${item(i,'saving')}${fixedRow('Total destinado no mês',t.spent)}<tr class="grand"><td>Sobra livre</td><td class="money">${cash(t.free)}</td></tr></tbody></table></div><div class="note">A dívida de maio é retirada da reserva na aba Investimentos, sem duplicar os gastos mensais.</div></section><aside><section class="panel"><div class="panelhead"><div><h2>Resumo do mês</h2><div class="sub">Valores atualizados automaticamente</div></div></div><div class="summarylist">${[['Receitas',t.income],['Contas fixas',t.fixed],['Pessoais',t.personal],['Cartões',t.cards],['Investimento',m.saving],['Total destinado',t.spent],['Sobra livre',t.free]].map(([x,n],idx)=>`<div class="summaryrow ${idx===6?'emphasis':''}"><span>${x}</span><strong class="${idx===6&&n<0?'red':''}">${cash(n)}</strong></div>`).join('')}</div></section><section class="panel" style="margin-top:17px"><div class="panelhead"><h2>Distribuição da receita</h2></div><div class="mini">${[['Contas fixas',t.fixed],['Pessoais',t.personal],['Cartões',t.cards],['Investimento',m.saving]].map(([name,n])=>`<div class="barrow"><span class="barlabel">${name}</span><span class="bartrack"><span class="barfill" style="display:block;width:${Math.min(100,t.income?100*n/t.income:0)}%"></span></span><span class="barvalue">${t.income?(100*n/t.income).toFixed(0):0}%</span></div>`).join('')}<p class="help">Percentuais sobre receitas do mês.</p></div></section></aside></div>`}
function chart(a){let vals=[data.initial,...a.map(x=>x.closing)],w=980,h=240,pad=35,min=Math.min(0,...vals),max=Math.max(1,...vals),range=max-min,xy=vals.map((v,i)=>[pad+(w-pad*2)*i/12,h-pad-(h-pad*2)*(v-min)/range]),poly=xy.map(p=>p.join(',')).join(' '),labels=['Início',...MONTHS.map(x=>x.slice(0,3))];return `<svg viewBox="0 0 ${w} ${h}" aria-label="Gráfico de saldo acumulado entre janeiro e dezembro" role="img"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#dce5ed"/>${[0,1,2,3,4].map(j=>{let v=min+range*j/4,y=h-pad-(h-pad*2)*j/4;return `<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#eaf0f5"/><text x="${pad-5}" y="${y-5}" text-anchor="end" font-size="10" fill="#8b99a6">${Math.round(v/1000)}k</text>`}).join('')}<polyline fill="none" stroke="#347fa1" stroke-width="3" stroke-linejoin="round" points="${poly}"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.7" fill="${i===5?'#c27055':'#347fa1'}"><title>${labels[i]}: ${cash(vals[i])}</title></circle><text x="${x}" y="${h-9}" text-anchor="middle" font-size="10" fill="#8293a2">${labels[i]}</text>`).join('')}</svg>`}
function invest(){let a=computed();$('main').innerHTML=`<div class="layout"><section class="panel full"><div class="panelhead"><div><h2>Investimentos e reserva</h2><div class="sub">Aportes vinculados automaticamente às abas mensais</div></div><span class="tag">Projeção anual</span></div><div class="chart">${chart(a)}</div><div class="tablewrap"><table class="investtable"><thead><tr><th>Mês</th><th class="money">Saldo inicial</th><th class="money">Aporte</th><th class="money">Dívidas / saídas</th><th class="money">Saldo final</th></tr></thead><tbody><tr><td><b>Saldo inicial da reserva</b></td><td class="money"><input class="editable" id="initialInput" type="number" min="0" step="0.01" value="${data.initial}" aria-label="Saldo inicial da reserva"></td><td colspan="3" style="color:#8a97a6;font-size:12px">Valor que você já possui antes de janeiro</td></tr>${a.map(r=>`<tr><td>${r.month}</td><td class="money">${cash(r.opening)}</td><td class="money">${cash(r.saving)}</td><td class="money">${input(r.i,'debt')}</td><td class="money" style="font-weight:750;color:${r.closing<0?'#b24c4c':'#216f62'}">${cash(r.closing)}</td></tr>`).join('')}<tr class="grand"><td>ANO 2027</td><td class="money">${cash(data.initial)}</td><td class="money">${cash(sum(a,'saving'))}</td><td class="money">${cash(sum(a,'debt'))}</td><td class="money">${cash(a[11].closing)}</td></tr></tbody></table></div><div class="note">Os aportes são editados nas abas mensais. Dívidas e saídas da reserva são editadas nesta tabela. Rendimentos não considerados.</div></section></div>`}
function overview(){let a=computed(),totInc=sum(a,'income'),totSpent=sum(a,'spent'),totFree=sum(a,'free');$('main').innerHTML=`<div class="layout"><section class="panel"><div class="panelhead"><div><h2>Resumo do ano</h2><div class="sub">Comparativo mensal de receitas e despesas</div></div><span class="tag">12 meses</span></div><div class="tablewrap"><table><thead><tr><th>Mês</th><th class="money">Receitas</th><th class="money">Despesas + aporte</th><th class="money">Sobra livre</th></tr></thead><tbody>${a.map(r=>`<tr><td><button class="btn" style="padding:5px 10px" data-goto="${r.i}">${r.month}</button></td><td class="money">${cash(r.income)}</td><td class="money">${cash(r.spent)}</td><td class="money ${r.free<0?'red':''}">${cash(r.free)}</td></tr>`).join('')}<tr class="grand"><td>Total anual</td><td class="money">${cash(totInc)}</td><td class="money">${cash(totSpent)}</td><td class="money">${cash(totFree)}</td></tr></tbody></table></div></section><aside><section class="panel"><div class="panelhead"><h2>Evolução da reserva</h2></div><div class="chart">${chart(a)}</div><div class="summarylist">${[['Saldo inicial',data.initial],['Aportes do ano',sum(a,'saving')],['Saídas da reserva',sum(a,'debt')],['Saldo final',a[11].closing]].map(([x,n],i)=>`<div class="summaryrow ${i===3?'emphasis':''}"><span>${x}</span><strong>${cash(n)}</strong></div>`).join('')}<button class="btn primary" data-goto="invest" style="margin-top:15px;width:100%">Ver investimentos</button></div></section><section class="panel" style="margin-top:17px"><div class="panelhead"><h2>Metas do ano</h2></div><div class="mini"><p>Janeiro e fevereiro: <b>${cash(data.months[0].saving)}</b> e <b>${cash(data.months[1].saving)}</b>.</p><p>Março a dezembro: metas editáveis em cada aba mensal.</p><p>Maior saída da reserva: <b>${cash(Math.max(...a.map(x=>x.debt)))}</b>.</p></div></section></aside></div>`}
function render(){renderMetrics();renderTabs();if(active==='overview')overview();else if(active==='invest')invest();else monthly(Number(active))}
function updateNumber(el){let n=Number(el.value),v=Number.isFinite(n)&&n>=0?Math.round(n*100)/100:0;if(el.id==='initialInput')data.initial=v;else{let i=Number(el.dataset.month),k=el.dataset.field;if(!FIELDS.includes(k)||!Number.isInteger(i)||i<0||i>11)return;data.months[i][k]=v}store();render()}
$('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){active=b.dataset.tab;render()}});$('main').addEventListener('click',e=>{let b=e.target.closest('[data-goto]');if(b){active=b.dataset.goto;render();window.scrollTo({top:250,behavior:'smooth'})}});$('main').addEventListener('change',e=>{if(e.target.matches('input.editable'))updateNumber(e.target)});$('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input.editable'))e.target.blur()});
$('exportBtn').addEventListener('click',()=>{let blob=new Blob([JSON.stringify({year:2027,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='planejamento_financeiro_2027_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado.')});$('importBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let raw=JSON.parse(await file.text());if(!Array.isArray(raw.months)||raw.months.length!==12)throw Error('Arquivo inválido');data=sanitize(raw);store();render();toast('Dados importados com sucesso.')}catch{toast('Arquivo inválido. Importe um backup JSON deste site.')}e.target.value=''});$('resetBtn').addEventListener('click',()=>{if(confirm('Deseja restaurar todos os valores originais? Isso substituirá suas alterações salvas.')){data=defaults();store();render();toast('Valores restaurados.')}});render();
})();
</script></body></html>
